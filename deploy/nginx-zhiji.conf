# 知己 反向代理（nginx）
# 放置到 /etc/nginx/sites-available/zhiji，软链到 sites-enabled，然后 nginx -t && systemctl reload nginx
# 把 your-domain.cn 换成你自己的域名（原生 App 必须走 HTTPS，见 README）。

server {
    listen 80;
    server_name your-domain.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.cn;

    # certbot 签发后会自动填这两行；没有证书时先删掉整段 443 或改成自签。
    ssl_certificate     /etc/letsencrypt/live/your-domain.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.cn/privkey.pem;

    # 后端单请求体上限 1MB，这里放宽到 2MB 留余量。
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
